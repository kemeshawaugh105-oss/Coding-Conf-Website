<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">

    <title>Coding Conf | Registration</title>
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>Coding Conf</h1>
        <p>Connect. Create. Code.</p>
    </header>

    <!-- Main Registration Content -->
    <main>

        <section>
            <h2>Register for Coding Conf</h2>

            <p>
                Complete the form below to secure your
                conference ticket.
            </p>
        </section>

        <!-- Registration Form -->
        <form id="registrationForm" novalidate>

            <!-- Full Name -->
            <label for="fullName">Full Name</label>

            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                autocomplete="name"
                aria-describedby="nameError"
                required
            >

            <span id="nameError" aria-live="polite"></span>


            <!-- Email Address -->
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                autocomplete="email"
                aria-describedby="emailError"
                required
            >

            <span id="emailError" aria-live="polite"></span>


            <!-- GitHub Username -->
            <label for="github">GitHub Username</label>

            <input
                type="text"
                id="github"
                name="github"
                placeholder="@username"
                aria-describedby="githubError"
                required
            >

            <span id="githubError" aria-live="polite"></span>


            <!-- Avatar Upload -->
            <label for="avatar">Upload Your Avatar</label>

            <p id="avatarHelp">
                Upload a JPG or PNG image smaller than 500KB.
            </p>

            <input
                type="file"
                id="avatar"
                name="avatar"
                accept="image/jpeg,image/png"
                aria-describedby="avatarHelp avatarError"
                required
            >

            <span id="avatarError" aria-live="polite"></span>


            <!-- Submit Button -->
            <button type="submit">
                Generate My Ticket
            </button>

        </form>

        <p>
            <a href="index.html">Back to Home</a>
        </p>

    </main>

    <!-- JavaScript Validation -->
    <script src="../js/validation.js"></script>

</body>
</html>
